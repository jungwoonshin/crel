# CREL v02: Adversarial NCE with spectral-norm scale control
# ==========================================================
# Key changes from v01:
#   - adversarial negatives (gradient ascent on energy for hard negatives)
#   - lower infonce temperature (0.1 → amplifies energy gap)
#   - moderate energy capacity (not oversized)
#   - no explicit energy regularization (spectral norm handles scale)

# Dataset
dataset:
  name: bibtex
  data_dir: ./data
  num_workers: 4

# Task Network
task_net:
  hidden_dims: [768, 768]   # task_net_hidden_dim=768, n_layers=2
  dropout: 0.219619615872438
  activation: relu

# CREL Energy (Loss Network)
energy:
  type: crel
  rank: 32                   # r: from optuna
  label_embed_dim: 64        # d_e
  proj_hidden_dim: 64        # d_h: from optuna
  higher_order:
    enabled: true
    proj_dim: 64
    hidden_dim: 128

# Feature network
feature_net:
  hidden_dims: [256, 256]    # feature_net_hidden_dim=256
  dropout: 0.219619615872438

# Training
training:
  total_epochs: 100
  batch_size: 64
  task_net_lr: 0.0015456578698013592
  loss_net_lr: 0.00978046497230848
  weight_decay: 1.0e-5
  optimizer: adamW

  lambda_bce: 1.0

  # EMA centering
  ema_beta: 0.99
  ema_warmup_beta: 0.9
  ema_warmup_fraction: 0.05

  # Contrastive loss
  contrastive_loss: infonce
  infonce_temperature: 1.0   # moderate: 0.1 saturates InfoNCE to 0 (dead gradient)
  nce_samples: 32
  nce_sampling: corruption    # flip GT labels — keeps negatives binary so energy
                              # can't cheat by detecting binary-vs-continuous

  grad_clip: 5.0

# Diagnostics
diagnostics:
  log_interval: 50
  gradient_cosine: true
  precision_alignment: true
  gradient_snr: true

# Logging
logging:
  backend: tensorboard
  log_dir: ./logs
  experiment_name: crel_v02

seed: 42
